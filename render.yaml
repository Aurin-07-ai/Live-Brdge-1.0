# Render Blueprint for the LiveBridge AI Flask backend.
# Docs: https://docs.render.com/blueprint-spec
# Secrets are NOT stored here — Render prompts for them when the Blueprint is created.
services:
  - type: web
    name: livebridge-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Dockerfile installs Tesseract + Python dependencies and runs gunicorn
    # with a 180s timeout (OCR + Gemini can exceed the 30s default).
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
